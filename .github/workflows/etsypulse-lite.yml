name: EtsyPulse Cloud

on:
  workflow_dispatch:
  schedule:
    # Every hour at :23 UTC (also :23 in Türkiye); avoid busy hour boundaries.
    # Collector caps requests, paces them and reserves live Etsy daily quota.
    - cron: "23 * * * *"

permissions:
  # The workflow commits only compact public Etsy observations. Secrets never
  # leave GitHub's encrypted Actions secret store.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "etsypulse-lite-pages"
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
      ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$ETSY_KEYSTRING"
          test -n "$ETSY_SHARED_SECRET"

      - name: Test discovery, monitoring and quota protection
        run: python -m unittest discover -s tests -v

      - name: Discover candidates and collect a quota-guarded measured snapshot
        run: python radar_lite.py --config config/research.json --state state/radar_state.json --site site

      - name: Persist compact public state
        run: |
          git config user.name "EtsyPulse Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/radar_state.json
          git diff --cached --quiet || git commit -m "Update EtsyPulse snapshot"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
